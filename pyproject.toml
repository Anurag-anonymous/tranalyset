[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tranalyset"
version = "0.1.0"
description = "Event-driven microkernel foundation for an AI trading operating system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111,<1.0",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx2>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tranalyset"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
